<ascii-video id="ascii" fit="cover" mirror inverse>
  <video></video>
</ascii-video>

<pixelate-video id="pixelate" fit="cover" mirror pixelation="50"></pixelate-video>
<glitch-video id="glitch" fit="cover" mirror></glitch-video>

<control-group>
  <div id="controlBackground"></div>
  <label>
    <radio-group id="variant">
      <radio-button value="ascii">ASCII</radio-button>
      <radio-button value="pixelate">Pixelate</radio-button>
      <radio-button checked value="glitch">Glitch</radio-button>
    </radio-group>
  </label>
</control-group>
